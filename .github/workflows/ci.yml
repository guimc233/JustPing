name: Build & Release

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # 1. Build Multi-Platform Host Binaries
  # =========================================================================
  build-host-binaries:
    name: Build Host (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            name: linux-amd64
            ext: ""
          - os: linux
            arch: arm64
            name: linux-arm64
            ext: ""
          - os: windows
            arch: amd64
            name: windows-amd64
            ext: ".exe"
          - os: windows
            arch: arm64
            name: windows-arm64
            ext: ".exe"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Assets
        working-directory: web
        run: |
          npm ci || npm install
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: '**/go.sum'

      - name: Compile Host Binary
        working-directory: host
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../dist
          OUTPUT="../dist/justping-host-${{ matrix.name }}${{ matrix.ext }}"
          go build -ldflags="-s -w" -o "$OUTPUT" ./cmd/server

      - name: Upload Host Artifact
        uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.name }}
          path: dist/justping-host-${{ matrix.name }}${{ matrix.ext }}

  # =========================================================================
  # 2. Build Multi-Platform Agent Binaries
  # =========================================================================
  build-agent-binaries:
    name: Build Agent (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux Common & Embedded
          - os: linux
            arch: amd64
            name: linux-amd64
            ext: ""
          - os: linux
            arch: 386
            name: linux-386
            ext: ""
          - os: linux
            arch: arm64
            name: linux-arm64
            ext: ""
          - os: linux
            arch: arm
            arm: "7"
            name: linux-armv7
            ext: ""
          - os: linux
            arch: arm
            arm: "6"
            name: linux-armv6
            ext: ""
          - os: linux
            arch: arm
            arm: "5"
            name: linux-armv5
            ext: ""
          - os: linux
            arch: riscv64
            name: linux-riscv64
            ext: ""
          - os: linux
            arch: ppc64le
            name: linux-ppc64le
            ext: ""
          - os: linux
            arch: s390x
            name: linux-s390x
            ext: ""
          # MIPS Series
          - os: linux
            arch: mips
            gomips: "hardfloat"
            name: linux-mips
            ext: ""
          - os: linux
            arch: mipsle
            gomips: "hardfloat"
            name: linux-mipsle
            ext: ""
          - os: linux
            arch: mips64
            name: linux-mips64
            ext: ""
          - os: linux
            arch: mips64le
            name: linux-mips64le
            ext: ""
          # Windows
          - os: windows
            arch: amd64
            name: windows-amd64
            ext: ".exe"
          - os: windows
            arch: 386
            name: windows-386
            ext: ".exe"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: '**/go.sum'

      - name: Compile Agent Binary
        working-directory: agent
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../dist
          OUTPUT="../dist/justping-agent-${{ matrix.name }}${{ matrix.ext }}"
          go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o "$OUTPUT" ./cmd/agent

      - name: Upload Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.name }}
          path: dist/justping-agent-${{ matrix.name }}${{ matrix.ext }}

  # =========================================================================
  # 3. Build & Push Multi-Arch Docker Image to GHCR
  # =========================================================================
  docker:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # =========================================================================
  # 4. Release Assets (When Tagged)
  # =========================================================================
  release:
    name: Create GitHub Release
    needs: [build-host-binaries, build-agent-binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries

      - name: Prepare Release Assets
        run: |
          mkdir -p release-dist
          find release-binaries/ -type f -exec mv {} release-dist/ \;
          ls -la release-dist/

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
